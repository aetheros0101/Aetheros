# flutter_app/flutter_rust_bridge.yaml
# FRB v2.9.0 konfigürasyonu
#
# v2'de rust_input dosya yolu değil, Rust crate modül yolu:
#   crate::bridge::api  →  src/bridge/api.rs
#
# Kullanım:
#   cd flutter_app
#   flutter_rust_bridge_codegen generate

rust_input: "crate::bridge::api"

dart_output: "lib/src/rust/"

rust_root: ".."

dart_preamble: |
  // ignore_for_file: unused_import, camel_case_types, depend_on_referenced_packages
