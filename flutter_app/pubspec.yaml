name: aetheros_app
description: AetherOS — AI destekli yerel otomasyon runtime

publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_rust_bridge: "2.12.0"
  path_provider: ^2.1.3
  uuid: ^4.5.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.6
  gap: ^3.0.1
  intl: ^0.19.0
  freezed_annotation: ^2.4.4

  # Sprint 3 — WASM modül yükleyici + lokal depolama
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2

  # Haziran 2026 — çoklu AI provider Ayarları (API key güvenli depolama)
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  ffigen: ^12.0.0
  freezed: ^2.5.7
  build_runner: ^2.4.12

# ============================================================
# KRİTİK: Bu bölüm olmadan Material Icons fontu APK'ya dahil
# edilmez ve TÜM ikonlar (Icons.* — geri ok, arama, ayarlar,
# her şey) kutu (□) olarak görünür. _rounded/_outlined
# varyantlarıyla ilgisi yok — bu eksik bölüm yüzünden font
# hiç paketlenmiyordu.
# ============================================================
flutter:
  uses-material-design: true
