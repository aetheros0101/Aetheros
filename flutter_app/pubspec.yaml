publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_rust_bridge: "2.9.0"
  path_provider: ^2.1.3
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.6
