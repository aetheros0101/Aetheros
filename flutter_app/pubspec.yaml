name: aetheros_app
description: AetherOS — AI destekli yerel otomasyon runtime

publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Flutter-Rust Bridge ─────────────────────────────────
  # Dart'ta exact pin: sadece versiyon numarası, "=" yok
  flutter_rust_bridge: "2.9.0"

  # ── Platform ────────────────────────────────────────────
  path_provider: ^2.1.3

  # ── State yönetimi ──────────────────────────────────────
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # ── UI ──────────────────────────────────────────────────
  cupertino_icons: ^1.0.6
  gap: ^3.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # NOT: flutter_rust_bridge_codegen pub.dev'de ayrı paket değil.
  # FRB v2'de codegen, flutter_rust_bridge içinde gelir.
  # Çalıştırma: dart run flutter_rust_bridge_codegen generate
  ffigen: ^12.0.0

flutter:
  uses-material-design: true
