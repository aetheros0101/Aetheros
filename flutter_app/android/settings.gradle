// flutter_app/android/settings.gradle
// Flutter 3.16+ yeni Gradle plugin sistemi
// Eski: apply from: "app_plugin_loader.gradle"  ← Flutter 3.16'da kaldırıldı
// Yeni: pluginManagement + includeBuild

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropsFile = file("local.properties")
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { properties.load(it) }
        }
        // CI'da FLUTTER_ROOT env var'dan al, local.properties yoksa
        def path = properties.getProperty("flutter.sdk") \
                   ?: System.getenv("FLUTTER_ROOT")
        assert path != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT not set"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
