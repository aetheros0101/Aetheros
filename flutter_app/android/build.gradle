// flutter_app/android/build.gradle (root)
// Flutter 3.16+ — plugin tanımları settings.gradle'a taşındı.
// Bu dosya artık yalnızca subproject config için kullanılır.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
