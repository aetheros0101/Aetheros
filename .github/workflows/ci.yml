name: 🦀 Rust CI

# Önceki durum: tek workflow (build_apk.yml) sadece Android APK derliyordu.
# cargo test / clippy / fmt / audit hiçbir yerde otomatik çalışmıyordu —
# 181 test var ama PR'larda regresyon koruması sağlamıyorlardı.
#
# Bu workflow her push/PR'da:
#   - cargo fmt --check     (biçim tutarlılığı)
#   - cargo clippy          (lint, uyarılar hata sayılır)
#   - cargo test            (varsayılan backend-wasmtime feature ile, 181 test)
#   - cargo audit           (bilinen güvenlik açığı olan bağımlılık taraması)
# çalıştırır.

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: 📐 cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: 📎 cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: ✅ cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  audit:
    name: 🔒 cargo audit
    runs-on: ubuntu-latest
    # Security audit is a blocking CI gate.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
