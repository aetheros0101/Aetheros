name: 🦀 Rust CI

# Önceki durum: tek workflow (build_apk.yml) sadece Android APK derliyordu.
# cargo test / clippy / fmt / audit hiçbir yerde otomatik çalışmıyordu.
#
# Bu workflow her push/PR'da:
#   - cargo fmt --check     (biçim tutarlılığı)
#   - cargo clippy          (lint, uyarılar hata sayılır)
#   - cargo test            (varsayılan backend-wasmtime feature ile)
#   - cargo test -p aetheros-terminal  (terminal crate'i kendi testleri)
#   - cargo test (wasmi)    (Android'e GİDEN backend — build_apk.yml bunu
#                            derliyor ama test etmiyordu)
#   - cargo audit           (bilinen güvenlik açığı olan bağımlılık taraması)
# çalıştırır.

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: 📐 cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: 📎 cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: ✅ cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 25   # takılan test CI'ı saatlerce tutmasın
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # aetheros-terminal ayrı bir crate: kök `cargo test` onun testlerini
      # koşmaz (PTY, timeout, session). Ayrı adımda açıkça koşulur.
      - run: cargo test -p aetheros-terminal

  test-wasmi:
    name: ✅ cargo test (backend-wasmi — Android backend'i)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # takılan test CI'ı saatlerce tutmasın
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasmi
      - run: cargo test --no-default-features --features backend-wasmi

  audit:
    name: 🔒 cargo audit
    runs-on: ubuntu-latest
    # Security audit is a blocking CI gate.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
