name: 🚀 Build Android APK

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  NDK_VERSION: '27.0.12077973'
  RUST_ANDROID_FEATURES: '--no-default-features --features backend-wasmi'

jobs:
  build-rust:
    name: 🦀 Rust → ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Android NDK ${{ env.NDK_VERSION }}
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -1)
          [ -z "$SDKMANAGER" ] && SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          [ -z "$SDKMANAGER" ] && { echo "❌ sdkmanager bulunamadı"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${{ env.NDK_VERSION }}"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH"         >> $GITHUB_ENV
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 🦀 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 🗃️ Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.rust_target }}
          cache-on-failure: true

      - name: 🔧 cargo-ndk cache
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}-${{ runner.arch }}

      - name: 🔧 cargo-ndk kur
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4

      # ══════════════════════════════════════════════════════
      # Android kaynak uyumluluk patch'leri
      # Bu adım, source dosyalarındaki Android-uyumsuz kodları
      # build öncesinde düzeltir:
      #
      #   1. memory.rs   → wasmtime'a özgü; backend-wasmtime
      #                    feature flag'i ile derle
      #   2. bridge/api  → FRB 2.9.0'da olmayan fonksiyon
      #   3. wasmi_host  → Dosya yoksa minimal stub oluştur
      # ══════════════════════════════════════════════════════
      - name: 🩹 Android kaynak patch'leri uygula
        run: |
          echo "── Patch 1: memory.rs → backend-wasmtime cfg gate ──"
          # mod.rs'de 'pub mod memory;' satırından önce cfg ekle
          if ! grep -q 'cfg(feature = "backend-wasmtime")' src/wasm/mod.rs; then
            sed -i '/^pub mod memory;/i #[cfg(feature = "backend-wasmtime")]' \
              src/wasm/mod.rs
            echo "  ✓ memory modülü gated"
          else
            echo "  ✓ zaten gated, atlandı"
          fi

          echo "── Patch 2: bridge/api.rs → FRB uyumsuz fonksiyon ──"
          if grep -q 'setup_default_user_code_handler' src/bridge/api.rs; then
            sed -i '/flutter_rust_bridge::setup_default_user_code_handler/d' \
              src/bridge/api.rs
            echo "  ✓ setup_default_user_code_handler kaldırıldı"
          else
            echo "  ✓ zaten düzgün, atlandı"
          fi

          echo "── Patch 3: wasmi_host.rs → dosya yoksa stub oluştur ──"
          if [ ! -f src/wasm/wasmi_host.rs ]; then
            cat > src/wasm/wasmi_host.rs << 'STUB'
          // wasmi backend host fonksiyon tanımları (Android)
          use wasmi::{Caller, Linker};
          use crate::errors::wasm::WasmError;

          pub struct WasmiHostContext {
              pub fuel_limit: u64,
              pub output: Vec<u8>,
          }

          impl WasmiHostContext {
              pub fn new(fuel_limit: u64) -> Self {
                  Self { fuel_limit, output: Vec::new() }
              }
          }

          pub fn register_host_functions(
              linker: &mut Linker<WasmiHostContext>,
          ) -> Result<(), WasmError> {
              linker
                  .func_wrap(
                      "env",
                      "aetheros_log",
                      |mut caller: Caller<WasmiHostContext>, ptr: i32, len: i32| {
                          let mem = caller
                              .get_export("memory")
                              .and_then(|e| e.into_memory());
                          if let Some(mem) = mem {
                              let data = mem.data(&caller);
                              let start = ptr as usize;
                              let end = (start + len as usize).min(data.len());
                              let msg = String::from_utf8_lossy(&data[start..end]);
                              tracing::debug!(target: "wasmi_host", "{}", msg);
                          }
                      },
                  )
                  .map_err(|e| WasmError::LinkerFailure { message: e.to_string() })?;

              linker
                  .func_wrap(
                      "env",
                      "aetheros_now_ms",
                      |_: Caller<WasmiHostContext>| -> i64 {
                          std::time::SystemTime::now()
                              .duration_since(std::time::UNIX_EPOCH)
                              .map(|d| d.as_millis() as i64)
                              .unwrap_or(0)
                      },
                  )
                  .map_err(|e| WasmError::LinkerFailure { message: e.to_string() })?;

              Ok(())
          }
          STUB
            echo "  ✓ wasmi_host.rs stub oluşturuldu"
          else
            echo "  ✓ wasmi_host.rs mevcut, atlandı"
          fi

          echo ""
          echo "=== Patch sonucu ==="
          grep -n "memory\|wasmi_host" src/wasm/mod.rs
          echo "---"
          grep -n "setup_default" src/bridge/api.rs || echo "FRB fonk. yok ✓"
          echo "---"
          ls -la src/wasm/wasmi_host.rs

      # ── Derleme ────────────────────────────────────────
      - name: 🏗️ Rust .so → ${{ matrix.abi }}
        run: |
          cargo ndk \
            --target ${{ matrix.rust_target }} \
            --output-dir flutter_app/android/app/src/main/jniLibs \
            build --release \
            --lib \
            ${{ env.RUST_ANDROID_FEATURES }}

      - name: 📋 .so bilgisi
        run: |
          SO="flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so"
          ls -lh "$SO"
          file "$SO"

      - name: 📤 .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-so-${{ matrix.abi }}
          path: flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so
          retention-days: 1

  build-apk:
    name: 📱 Flutter APK
    runs-on: ubuntu-latest
    needs: build-rust

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📁 jniLibs dizinleri
        run: |
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: 📥 arm64-v8a .so
        uses: actions/download-artifact@v4
        with:
          name: rust-so-arm64-v8a
          path: flutter_app/android/app/src/main/jniLibs/arm64-v8a

      - name: 📥 armeabi-v7a .so
        uses: actions/download-artifact@v4
        with:
          name: rust-so-armeabi-v7a
          path: flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: ✅ .so doğrula
        run: |
          find flutter_app/android/app/src/main/jniLibs -name "*.so" \
            -exec ls -lh {} \;

      - name: 🦀 Rust (FRB codegen)
        uses: dtolnay/rust-toolchain@stable

      - name: 🗃️ Rust cache (codegen)
        uses: Swatinem/rust-cache@v2
        with:
          key: frb-codegen
          cache-on-failure: true

      - name: 🐦 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: ⚙️ FRB Dart kodu üret
        working-directory: flutter_app
        run: dart run flutter_rust_bridge_codegen generate
        continue-on-error: true

      - name: 🏗️ APK derle
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-number=${{ github.run_number }}

      - name: 📋 APK boyutları
        run: |
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" \
            -exec ls -lh {} \;

      - name: 📤 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-apk-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📊 Build özeti
        if: always()
        run: |
          echo "## 🚀 AetherOS Android Build" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | ${{ env.NDK_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | wasmi |" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK'lar" >> $GITHUB_STEP_SUMMARY
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" \
            2>/dev/null | while read f; do
            echo "- \`$(basename $f)\` ($(du -sh $f | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done || echo "APK üretilemedi" >> $GITHUB_STEP_SUMMARY
