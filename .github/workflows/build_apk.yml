name: 🚀 Build Android APK

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  NDK_VERSION: '27.0.12077973'
  RUST_ANDROID_FEATURES: '--no-default-features --features backend-wasmi'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Sprint 7: yeni fonksiyonlar — codegen versiyon sabitleme
  FRB_VERSION: '2.12.0'

# ──────────────────────────────────────────────────────────────────────────────
# JOB 0: FRB Codegen
#
# Rust bridge/api.rs'deki pub fn'leri tarar → frb_generated.rs + Dart stub'ları
# üretir. Sonraki job'lar bu artifact'ı kullanır.
#
# Sprint sonrası eklenen bridge fonksiyonları:
#   Sprint 6: check_module_exists, resubmit_task
#   Sprint 7: get_recent_logs, get_task_logs
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  codegen:
    name: ⚙️ FRB Codegen
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 🗃️ Rust cache (codegen host)
        uses: Swatinem/rust-cache@v2
        with:
          key: codegen-host-${{ hashFiles('Cargo.lock') }}

      - name: 🐦 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🔧 flutter_rust_bridge_codegen kur
        run: |
          cargo install flutter_rust_bridge_codegen \
            --version ${{ env.FRB_VERSION }} \
            --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: ⚙️ FRB codegen çalıştır
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate
          echo "✅ FRB codegen tamamlandı"

      - name: 🏗️ build_runner (@freezed + json_serializable)
        working-directory: flutter_app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          echo "✅ build_runner tamamlandı"

      - name: 🔍 Üretilen Dart bridge'i doğrula
        run: |
          # Sprint 7 fonksiyonlarının Dart binding'lerini kontrol et
          BRIDGE="flutter_app/lib/src/rust/api/aetheros.dart"
          for fn in \
            "getRecentLogs" \
            "getTaskLogs" \
            "checkModuleExists" \
            "resubmitTask" \
            "uploadWasmModule"; do
            if grep -q "$fn" "$BRIDGE"; then
              echo "✅ $fn → Dart binding'i var"
            else
              echo "❌ $fn → Dart binding'i YOK!"
              exit 1
            fi
          done

      - name: 📤 Üretilen dosyaları artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: frb-generated-${{ github.sha }}
          path: |
            src/frb_generated.rs
            flutter_app/lib/src/rust/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Rust → .so  (arm64-v8a & armeabi-v7a paralel)
  # ────────────────────────────────────────────────────────────────────────────
  build-rust:
    name: 🦀 Rust → ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: codegen

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 FRB artifact indir
        uses: actions/download-artifact@v4
        with:
          name: frb-generated-${{ github.sha }}
          path: .

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Android NDK ${{ env.NDK_VERSION }}
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -1)
          [ -z "$SDKMANAGER" ] && SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${{ env.NDK_VERSION }}"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH"         >> $GITHUB_ENV
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 🦀 Rust stable + hedef
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 🗃️ Rust cache (cross)
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.rust_target }}-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: 🔧 cargo-ndk (cache)
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}

      - name: 🔧 cargo-ndk kur
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      # ── Kaynak patch'leri ─────────────────────────────────────────────────
      # 1. memory.rs: wasmtime-only guard (wasmi build'inde derlenmemeli)
      # 2. frb_generated.rs: lib.rs'e bağlı mı kontrol et
      # 3. setup_default_user_code_handler: eski FRB kalıntısı, kaldır
      - name: 🩹 Kaynak patch'leri
        run: |
          set -e

          # 1. memory.rs wasmtime guard
          if ! head -1 src/wasm/memory.rs | grep -q 'cfg(feature'; then
            printf '#![cfg(feature = "backend-wasmtime")]\n' | \
              cat - src/wasm/memory.rs > /tmp/mem.rs && \
              mv /tmp/mem.rs src/wasm/memory.rs
            echo "✓ memory.rs patch uygulandı"
          else
            echo "✓ memory.rs guard zaten var"
          fi

          # 2. frb_generated.rs bağlantısı
          if [ -f src/frb_generated.rs ]; then
            if ! grep -q 'mod frb_generated' src/lib.rs; then
              printf '\npub mod frb_generated;\n' >> src/lib.rs
              echo "✓ mod frb_generated eklendi"
            else
              echo "✓ mod frb_generated zaten var"
            fi
          else
            echo "❌ src/frb_generated.rs YOK — codegen artifact bozuk!"
            exit 1
          fi

          # 3. Eski FRB fonksiyonu kalıntısı (zararsız ama temiz kalsın)
          sed -i '/setup_default_user_code_handler/d' src/bridge/api.rs || true
          echo "✓ Eski FRB kalıntısı temizlendi"

      - name: 🏗️ Rust .so → ${{ matrix.abi }}
        run: |
          cargo ndk \
            --target ${{ matrix.rust_target }} \
            --output-dir flutter_app/android/app/src/main/jniLibs \
            build --release \
            --lib \
            ${{ env.RUST_ANDROID_FEATURES }}

      - name: 🔍 .so varlığını doğrula
        run: |
          SO="flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so"
          if [ -f "$SO" ]; then
            SIZE=$(du -sh "$SO" | cut -f1)
            echo "✅ libaetheros.so ($SIZE) → ${{ matrix.abi }}"
          else
            echo "❌ libaetheros.so bulunamadı!"
            exit 1
          fi

      - name: 📤 .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-so-${{ matrix.abi }}-${{ github.sha }}
          path: flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Flutter APK
  # ────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: 📱 Flutter APK
    runs-on: ubuntu-latest
    needs: build-rust

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 FRB artifact indir
        uses: actions/download-artifact@v4
        with:
          name: frb-generated-${{ github.sha }}
          path: .

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📁 jniLibs dizinleri
        run: |
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: 📥 arm64-v8a .so
        uses: actions/download-artifact@v4
        with:
          name: rust-so-arm64-v8a-${{ github.sha }}
          path: flutter_app/android/app/src/main/jniLibs/arm64-v8a

      - name: 📥 armeabi-v7a .so
        uses: actions/download-artifact@v4
        with:
          name: rust-so-armeabi-v7a-${{ github.sha }}
          path: flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: 🐦 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📝 local.properties
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}"  > flutter_app/android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> flutter_app/android/local.properties

      - name: 📦 Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: 🔍 Dart analiz
        working-directory: flutter_app
        run: |
          flutter analyze --no-fatal-infos 2>&1 | tail -20 || true
          echo "✅ Dart analiz tamamlandı"

      - name: 🏗️ APK derle
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-number=${{ github.run_number }}

      - name: 📤 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-apk-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📊 Build özeti
        if: always()
        run: |
          {
            echo "## 🚀 AetherOS Android Build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build | #${{ github.run_number }} |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Flutter | ${{ env.FLUTTER_VERSION }} |"
            echo "| NDK | ${{ env.NDK_VERSION }} |"
            echo "| Backend | wasmi |"
            echo "| Sprints | S1–S7 (Log izleme) |"
            echo ""
            echo "### 📦 APK'lar"
            find flutter_app/build/app/outputs/flutter-apk \
              -name "*.apk" 2>/dev/null | \
              while read -r f; do
                echo "- \`$(basename "$f")\` ($(du -sh "$f" | cut -f1))"
              done || echo "APK üretilemedi"
          } >> $GITHUB_STEP_SUMMARY
