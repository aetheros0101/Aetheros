name: 🚀 Build Android APK

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  NDK_VERSION: '27.0.12077973'
  RUST_ANDROID_FEATURES: '--no-default-features --features backend-wasmi'

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Rust → .so (paralel)
  # ─────────────────────────────────────────────────────────
  build-rust:
    name: 🦀 Rust → ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Ortam tanı — tam hata görülmesi için ──────────
      - name: 🔍 Android SDK ortamı kontrol
        run: |
          echo "=== SDK paths ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo ""
          echo "=== cmdline-tools içeriği ==="
          ls "${ANDROID_SDK_ROOT}/cmdline-tools/" 2>/dev/null || \
            echo "cmdline-tools dizini yok!"
          echo ""
          echo "=== sdkmanager konumu ==="
          find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null || \
            echo "sdkmanager bulunamadı"
          echo ""
          echo "=== Kurulu NDK'lar ==="
          ls "${ANDROID_SDK_ROOT}/ndk/" 2>/dev/null || \
            echo "NDK dizini yok"

      # ── NDK — sdkmanager'ı dinamik bul ──────────────
      - name: 📦 Android NDK ${{ env.NDK_VERSION }}
        run: |
          # sdkmanager'ı bul (runner'a göre path değişebilir)
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            # Fallback: PATH'te var mı?
            SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager bulunamadı!"
            echo "SDK root içeriği:"
            ls "${ANDROID_SDK_ROOT}/" || true
            exit 1
          fi

          echo "✅ sdkmanager: $SDKMANAGER"

          # Lisansları onayla
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # NDK kur
          "$SDKMANAGER" "ndk;${{ env.NDK_VERSION }}"

          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$NDK_PATH"         >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH"                 >> $GITHUB_ENV
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> $GITHUB_PATH

          echo "✅ NDK kuruldu: $NDK_PATH"
          ls "$NDK_PATH" | head -5

      # ── Rust ───────────────────────────────────────
      - name: 🦀 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 🗃️ Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.rust_target }}
          cache-on-failure: true

      # cargo-ndk binary cache
      - name: 🔧 cargo-ndk cache
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}-${{ runner.arch }}

      - name: 🔧 cargo-ndk kur
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: |
          # --locked kaldırıldı — bazı runner'larda Cargo.lock uyumsuzluğuna yol açıyor
          cargo install cargo-ndk --version 3.5.4

      - name: ✅ cargo-ndk versiyon kontrol
        run: cargo ndk --version

      # ── Derleme ────────────────────────────────────
      - name: 🏗️ Rust .so → ${{ matrix.abi }}
        run: |
          cargo ndk \
            --target ${{ matrix.rust_target }} \
            --output-dir flutter_app/android/app/src/main/jniLibs \
            build --release \
            ${{ env.RUST_ANDROID_FEATURES }}

      - name: 📋 .so bilgisi
        run: |
          SO="flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so"
          ls -lh "$SO"
          file "$SO"

      - name: 📤 .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-so-${{ matrix.abi }}
          path: flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # JOB 2: Flutter APK
  # ─────────────────────────────────────────────────────────
  build-apk:
    name: 📱 Flutter APK
    runs-on: ubuntu-latest
    needs: build-rust

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📁 jniLibs dizinleri
        run: |
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: 📥 arm64-v8a .so
        uses: actions/download-artifact@v4
        with:
          name: rust-so-arm64-v8a
          path: flutter_app/android/app/src/main/jniLibs/arm64-v8a

      - name: 📥 armeabi-v7a .so
        uses: actions/download-artifact@v4
        with:
          name: rust-so-armeabi-v7a
          path: flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: ✅ .so doğrula
        run: |
          find flutter_app/android/app/src/main/jniLibs -name "*.so" \
            -exec ls -lh {} \;

      - name: 🦀 Rust (FRB codegen)
        uses: dtolnay/rust-toolchain@stable

      - name: 🗃️ Rust cache (codegen)
        uses: Swatinem/rust-cache@v2
        with:
          key: frb-codegen
          cache-on-failure: true

      - name: 🐦 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: ⚙️ FRB Dart kodu üret
        working-directory: flutter_app
        run: dart run flutter_rust_bridge_codegen generate
        continue-on-error: true

      - name: 🏗️ APK derle
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-number=${{ github.run_number }}

      - name: 📋 APK boyutları
        run: |
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" \
            -exec ls -lh {} \;

      - name: 📤 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-apk-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📊 Build özeti
        if: always()
        run: |
          echo "## 🚀 AetherOS Android Build" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | ${{ env.NDK_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | wasmi |" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK'lar" >> $GITHUB_STEP_SUMMARY
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" \
            2>/dev/null | while read f; do
            echo "- \`$(basename $f)\` ($(du -sh $f | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done || echo "APK üretilemedi" >> $GITHUB_STEP_SUMMARY
