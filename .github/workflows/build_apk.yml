name: 🚀 Build Android APK

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  NDK_VERSION: '27.0.12077973'
  RUST_ANDROID_FEATURES: '--no-default-features --features backend-wasmi'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 0: FRB Codegen
  # flutter_rust_bridge_codegen generate → frb_generated.rs + Dart dosyalarını
  # yeniden üretir. Rust kaynak kodu değişince bu job otomatik senkronize eder.
  # ─────────────────────────────────────────────────────────────────────────
  codegen:
    name: ⚙️ FRB Codegen
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🦀 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 🗃️ Rust cache (codegen)
        uses: Swatinem/rust-cache@v2
        with:
          key: codegen-host

      - name: 🐦 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🔧 flutter_rust_bridge_codegen kur
        run: |
          # Sabit sürüm — pubspec.yaml ile uyumlu
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: ⚙️ FRB codegen çalıştır
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate
          # ── Barrel: Rust api/ alt modülleri → tek Dart yüzeyi ──
          # FRB her alt modül için lib/src/rust/bridge/api/<modül>.dart üretir.
          # api/aetheros.dart adaptörü bunları bridge_api.dart üzerinden alır.
          barrel=lib/src/rust/api/bridge_api.dart
          test -d lib/src/rust/bridge/api || { echo "❌ bridge/api/ üretilmedi"; ls -R lib/src/rust/bridge; exit 1; }
          {
            echo "// GENERATED (CI) — elle düzenlemeyin."
            echo "// ignore_for_file: directives_ordering"
            for f in $(ls lib/src/rust/bridge/api/*.dart | grep -v '\.\(freezed\|g\)\.dart$' | sort); do
              echo "export '../bridge/api/$(basename "$f")';"
            done
          } > "$barrel"
          echo "📦 bridge_api.dart:"; cat "$barrel"
          # ── Freezed & json_serializable implementation üret ──
          # bridge/types.dart @freezed sınıfları için gerekli
          dart run build_runner build --delete-conflicting-outputs
          echo "✅ Codegen + build_runner tamamlandı"

      - name: 📤 Üretilen dosyaları artifact olarak yükle
        uses: actions/upload-artifact@v5
        with:
          name: frb-generated
          # Rust tarafı + Dart tarafı generated dosyalar
          path: |
            src/frb_generated.rs
            flutter_app/lib/src/rust/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Rust → .so  (arm64-v8a & armeabi-v7a paralel)
  # ─────────────────────────────────────────────────────────────────────────
  build-rust:
    name: 🦀 Rust → ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: codegen

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📥 Üretilen FRB dosyaları indir
        uses: actions/download-artifact@v5
        with:
          name: frb-generated
          # Dosyalar orijinal yollarına yerleşir
          path: .

      - name: ☕ Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Android NDK
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -1)
          [ -z "$SDKMANAGER" ] && SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${{ env.NDK_VERSION }}"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH"         >> $GITHUB_ENV
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 🦀 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 🗃️ Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.rust_target }}
          cache-on-failure: true

      - name: 🔧 cargo-ndk cache
        id: cargo-ndk-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}-${{ runner.arch }}

      - name: 🔧 cargo-ndk kur
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4

      - name: 🩹 Android kaynak patch'leri
        run: |
          # memory.rs → wasmtime-only guard
          if ! head -1 src/wasm/memory.rs | grep -q "cfg(feature"; then
            { printf '#![cfg(feature = "backend-wasmtime")]\n'; \
              cat src/wasm/memory.rs; } > /tmp/mem.rs && mv /tmp/mem.rs src/wasm/memory.rs
          fi
          # frb_generated.rs lib.rs'e bağlı mı?
          if [ -f src/frb_generated.rs ]; then
            if ! grep -q "mod frb_generated" src/lib.rs; then
              printf '\npub mod frb_generated;\n' >> src/lib.rs
              echo "✓ mod frb_generated eklendi"
            else
              echo "✓ mod frb_generated zaten var"
            fi
          else
            echo "❌ src/frb_generated.rs YOK — codegen artifact kontrol et!"
            exit 1
          fi

      - name: 🏗️ Rust .so → ${{ matrix.abi }}
        run: |
          cargo ndk \
            --target ${{ matrix.rust_target }} \
            --output-dir flutter_app/android/app/src/main/jniLibs \
            build --release \
            --lib \
            ${{ env.RUST_ANDROID_FEATURES }}

      - name: 📤 .so artifact
        uses: actions/upload-artifact@v5
        with:
          name: rust-so-${{ matrix.abi }}
          path: flutter_app/android/app/src/main/jniLibs/${{ matrix.abi }}/libaetheros.so
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Flutter APK
  # ─────────────────────────────────────────────────────────────────────────
  build-apk:
    name: 📱 Flutter APK
    runs-on: ubuntu-latest
    needs: build-rust

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📥 Üretilen FRB dosyaları indir
        uses: actions/download-artifact@v5
        with:
          name: frb-generated
          path: .

      - name: ☕ Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📁 jniLibs dizinleri
        run: |
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: 📥 arm64-v8a .so
        uses: actions/download-artifact@v5
        with:
          name: rust-so-arm64-v8a
          path: flutter_app/android/app/src/main/jniLibs/arm64-v8a

      - name: 📥 armeabi-v7a .so
        uses: actions/download-artifact@v5
        with:
          name: rust-so-armeabi-v7a
          path: flutter_app/android/app/src/main/jniLibs/armeabi-v7a

      - name: 🐦 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📝 local.properties
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}" > flutter_app/android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}"  >> flutter_app/android/local.properties

      - name: 📦 Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: 🏗️ APK derle
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-number=${{ github.run_number }}

      - name: 📤 APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: aetheros-apk-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📊 Build özeti
        if: always()
        run: |
          echo "## 🚀 AetherOS Android Build" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | ${{ env.NDK_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | wasmi |" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK'lar" >> $GITHUB_STEP_SUMMARY
          find flutter_app/build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | \
            while read f; do
              echo "- \`$(basename $f)\` ($(du -sh $f | cut -f1))" >> $GITHUB_STEP_SUMMARY
            done || echo "APK üretilemedi" >> $GITHUB_STEP_SUMMARY
