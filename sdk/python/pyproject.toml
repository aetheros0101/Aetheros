[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetheros-sdk"
version = "0.1.0"
description = "Python SDK for AetherOS Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AetherOS" }]

keywords = ["aetheros", "wasm", "runtime", "ai", "workflow"]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",       # httpx mock
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["aetheros"]
