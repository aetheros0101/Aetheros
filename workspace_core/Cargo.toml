[package]
name = "aetheros-workspace"
version = "0.5.0"
edition = "2021"
description = "AetherOS coding-agent workspace engine: guarded FS, incremental index, search, symbols, LSP, git"
license = "MIT"

[features]
default = []
watcher = ["dep:notify"]
# Tree-sitter integration (host supplies grammar crates via SymbolParser trait).
symbols = []
# LSP stdio JSON-RPC client helpers.
lsp-client = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.61"
walkdir = "2.5.0"
ignore = "0.4.22"
globset = "0.4.14"
regex = "1.10.5"
notify = { version = "6.1.1", optional = true }

[dev-dependencies]
tempfile = "3.10.1"
