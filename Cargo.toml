[package]
name = "aetheros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AetherOS"]
description = "Production-grade async runtime orchestration system"

# ── Binary ────────────────────────────────────────────────
[[bin]]
name = "aetheros"
path = "src/main.rs"

# ── Benchmark ────────────────────────────────────────────
[[bench]]
name = "runtime_bench"
harness = false

# ── Dependencies ─────────────────────────────────────────
[dependencies]
tokio       = { version = "1",    features = ["full", "signal"] }
wasmtime    = { version = "38",   features = ["async", "component-model"] }
wasmtime-wasi = "38"
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1",    features = ["v4", "serde"] }
sled        = "0.34"
async-trait = "0.1"
chrono      = { version = "0.4",  features = ["serde"] }
bytes       = "1"
futures     = "0.3"
rand        = "0.9"
parking_lot = "0.12"
dashmap     = "6"
tokio-util  = "0.7"
smallvec    = "1"
anyhow      = "1"
axum        = { version = "0.8.9", features = ["ws"] }
sha2        = "0.11.0"
semver      = "1.0.28"
hex         = "0.4.3"
reqwest     = { version = "0.12", features = ["json"] }
wat         = "1"
rmp-serde   = "1.3"
# ── Dev / Test Dependencies ───────────────────────────────
[dev-dependencies]
tokio-test   = "0.4"
criterion    = { version = "0.7", features = ["async_tokio"] }
tempfile     = "3"
serial_test  = "3"

# ── Profile: Release ──────────────────────────────────────
[profile.release]
opt-level   = 3
lto         = true      # Link-time optimization
codegen-units = 1       # Tek codegen unit → daha iyi optimizasyon
strip       = true      # Debug sembollerini çıkar → küçük binary
panic       = "abort"   # Unwind yerine abort → daha küçük binary

# ── Profile: Bench ────────────────────────────────────────
[profile.bench]
opt-level   = 3
lto         = true
codegen-units = 1
