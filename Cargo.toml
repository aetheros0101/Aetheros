[package]
name = "aetheros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AetherOS"]
description = "Production-grade async runtime orchestration system"

# ── Features ──────────────────────────────────────────────
#
#  backend-wasmtime  →  JIT (Cranelift) — server/desktop varsayılan
#  backend-wasmi     →  Interpreter     — Android / Play Store zorunlu
#
#  Android build:
#    cargo ndk -t arm64-v8a -o ../flutter_app/android/app/src/main/jniLibs \
#              build --release \
#              --no-default-features --features backend-wasmi
#
#  Server build (varsayılan):
#    cargo build --release   (backend-wasmtime aktif)
#
[features]
default          = ["backend-wasmtime"]
backend-wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
backend-wasmi    = ["dep:wasmi"]

# ── Library (Flutter FFI / cdylib) ────────────────────────
# Flutter, .so (Android) veya .dylib (iOS/macOS) olarak yükler.
# staticlib: iOS static linking için.
[lib]
name        = "aetheros"
crate-type  = ["cdylib", "staticlib"]

# ── Binary (sunucu) ───────────────────────────────────────
[[bin]]
name = "aetheros"
path = "src/main.rs"

# ── Benchmark ────────────────────────────────────────────
[[bench]]
name = "runtime_bench"
harness = false

# ── Dependencies ─────────────────────────────────────────
[dependencies]
tokio       = { version = "1", features = ["full", "signal"] }

# ── WASM backend — sadece biri aktif olmalı ───────────────
wasmtime      = { version = "38",  features = ["async", "component-model"], optional = true }
wasmtime-wasi = { version = "38",  optional = true }
wasmi         = { version = "0.31", features = ["std"],                     optional = true }

# ── Flutter-Rust Bridge ───────────────────────────────────
# Flutter ↔ Rust FFI köprüsü.
# Kod üretimi: flutter_rust_bridge_codegen generate
flutter_rust_bridge = "=2.9.0"

serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1",    features = ["v4", "serde"] }
sled        = "0.34"
async-trait = "0.1"
chrono      = { version = "0.4",  features = ["serde"] }
bytes       = "1"
futures     = "0.3"
rand        = "0.9"
parking_lot = "0.12"
dashmap     = "6"
tokio-util  = "0.7"
smallvec    = "1"
anyhow      = "1"
axum        = { version = "0.8.9", features = ["ws"] }
sha2        = "0.11.0"
semver      = "1.0.28"
hex         = "0.4.3"
# default-features = false → native-tls (OpenSSL) devre dışı
# rustls-tls → saf Rust TLS, Android cross-compile'da OpenSSL gerekmez
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wat         = "1"
rmp-serde   = "1.3"

# ── Android logging ───────────────────────────────────────
# Android'de tracing → logcat entegrasyonu.
# Sadece Android target'ta derlenir.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
# android_logger log facade'ini kullanır — açıkça eklenmeli
log            = "0.4"

# ── Dev / Test Dependencies ───────────────────────────────
[dev-dependencies]
tokio-test   = "0.4"
criterion    = { version = "0.7", features = ["async_tokio"] }
tempfile     = "3"
serial_test  = "3"

# ── Profile: Release ──────────────────────────────────────
[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true
panic       = "abort"

# ── Profile: Bench ────────────────────────────────────────
[profile.bench]
opt-level   = 3
lto         = true
codegen-units = 1
