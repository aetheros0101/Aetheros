[package]
name = "aetheros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AetherOS"]
description = "Production-grade async runtime orchestration system"

# ── Workspace ─────────────────────────────────────────────
# aetheros-terminal path-dependency olarak zaten kök dizinde; [workspace]
# bildirimi onu otomatik üye yapar, böylece `cargo test -p aetheros-terminal`
# çalışır (workspace YOKKEN kendi testleri hiçbir yerde koşmuyordu).
# tools/context_builder kendi Cargo.lock'una sahip bağımsız bir araç:
# dışlanmazsa içinde `cargo build` "workspace'e ait değil" hatası verir.
# NOT: default-members BİLEREK verilmedi — `cargo ndk build --lib
# --features ...` (APK hattı) çoklu paket seçimiyle karışmasın.
[workspace]
exclude = ["tools/context_builder"]

# ── Features ──────────────────────────────────────────────
#
#  backend-wasmtime  →  JIT (Cranelift) — server/desktop varsayılan
#  backend-wasmi     →  Interpreter     — Android / Play Store zorunlu
#
#  Android build:
#    cargo ndk -t arm64-v8a -o ../flutter_app/android/app/src/main/jniLibs \
#              build --release \
#              --no-default-features --features backend-wasmi
#
#  Server build (varsayılan):
#    cargo build --release   (backend-wasmtime aktif)
#
[features]
default          = ["backend-wasmtime"]
backend-wasmtime = ["dep:wasmtime"]
backend-wasmi    = ["dep:wasmi"]

# ── Library (Flutter FFI / cdylib) ────────────────────────
# Flutter, .so (Android) veya .dylib (iOS/macOS) olarak yükler.
# staticlib: iOS static linking için.
[lib]
name        = "aetheros"
# cdylib    → Android JNI (.so)
# staticlib → iOS / static linking
# rlib      → yerel binary build için (src/main.rs → use aetheros::...)
crate-type  = ["cdylib", "staticlib", "rlib"]

# ── Binary (sunucu) ───────────────────────────────────────
[[bin]]
name = "aetheros"
path = "src/main.rs"

# ── Benchmark ────────────────────────────────────────────
[[bench]]
name = "runtime_bench"
harness = false

# ── Dependencies ─────────────────────────────────────────
[dependencies]
# V10 Faz 1: terminal execution layer (bkz. aetheros-terminal/README.md).
# Bilerek ayrı bir crate — PTY/session iç detayları AgentTool arayüzünü
# kirletmesin diye; entegrasyon src/agents/tools/terminal_tool.rs'te.
aetheros-terminal = { path = "aetheros-terminal" }
# Dosya/arama/git primitifleri; agent entegrasyonu src/agents/workspace_tool.rs
aetheros-workspace = { path = "workspace_core" }
# Niyet → gereksinim → görev grafı derleyicisi (agents::planning::intent_plan).
aetheros-intent = { path = "aetheros-intent" }
tokio       = { version = "1", features = ["full", "signal"] }

# ── WASM backend — sadece biri aktif olmalı ───────────────
wasmtime      = { version = "38",  features = ["async", "component-model"], optional = true }
wasmi         = { version = "0.31", features = ["std"],                     optional = true }

# ── Flutter-Rust Bridge ───────────────────────────────────
# Flutter ↔ Rust FFI köprüsü.
# Kod üretimi: flutter_rust_bridge_codegen generate
flutter_rust_bridge = { version = "=2.12.0", features = ["uuid"] }

serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1",    features = ["v4", "serde"] }
sled        = "0.34"
async-trait = "0.1"
chrono      = { version = "0.4",  features = ["serde"] }
futures     = "0.3"
rand        = "0.9"
parking_lot = "0.12"
dashmap     = "6"
tokio-util  = "0.7"
axum        = { version = "0.8.9", features = ["ws"] }
sha2        = "0.11.0"
ring        = "0.17.14"
hex         = "0.4.3"
# default-features = false → native-tls (OpenSSL) devre dışı
# rustls-tls → saf Rust TLS, Android cross-compile'da OpenSSL gerekmez
#
# NOT (V10): hickory-dns BİLEREK kaldırıldı. hickory-dns, DNS config'i
# /etc/resolv.conf'tan okuyor — bu dosya Android APK sandbox'ında yok/
# erişilemez, bu yüzden DNS çözümü ağa hiç çıkmadan anında hata veriyor
# ("Bağlantı kurulamadı" — gerçekte hiç denenmemiş). hickory-dns olmadan
# reqwest, sistemin kendi getaddrinfo() mekanizmasına düşüyor — bu,
# Android'de doğru çalışan tek yol. Masaüstü/sunucu derlemesinde de
# fark yaratmaz, sistem resolver zaten oradan kullanılabilir.
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wat         = "1"
rmp-serde   = "1.3"

# ── Android logging ───────────────────────────────────────
# Android'de tracing → logcat entegrasyonu.
# Sadece Android target'ta derlenir.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
# android_logger log facade'ini kullanır — açıkça eklenmeli
log            = "0.4"

# ── Dev / Test Dependencies ───────────────────────────────
[dev-dependencies]
tokio-test   = "0.4"
criterion    = { version = "0.7", features = ["async_tokio"] }
tempfile     = "3"
serial_test  = "3"

# ── Profile: Release ──────────────────────────────────────
[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true

# Cihaz-üstü (Termux/ARM) hızlı iterasyon için — üretim [profile.release]
# ayarlarını DEĞİŞTİRMEZ. Fat LTO + codegen-units=1 telefon CPU'sunda
# 20-40+ dakika sürebiliyor; bu profil onun yerine ~release hızında
# çalışan ama çok daha hızlı derlenen bir binary verir.
#   cargo build --profile release-fast --no-default-features --features backend-wasmi
#   ./target/release-fast/aetheros
[profile.release-fast]
inherits      = "release"
lto           = false
codegen-units = 16
panic       = "abort"

# ── Profile: Bench ────────────────────────────────────────
[profile.bench]
opt-level   = 3
lto         = true
codegen-units = 1
