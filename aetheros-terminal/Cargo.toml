[package]
name = "aetheros-terminal"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Process and terminal execution layer for Aetheros"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
thiserror = "2"
async-trait = "0.1"
portable-pty = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
