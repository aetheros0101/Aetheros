[package]
name = "aetheros-intent"
version = "0.4.0"
edition = "2024"
description = "Intent→RequirementSet→TaskGraph; provider-agnostic LLM ports + Task Layer adapter boundary"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
